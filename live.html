<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shaka Player - Direct Link</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.3.5/shaka-player.compiled.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.3.5/controls.css">
    
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; }
        .container { width: 100%; height: 100%; }
        video { width: 100%; height: 100%; }
    </style>
</head>
<body>

    <div data-shaka-player-container class="container">
        <video data-shaka-player id="video" autoplay></video>
    </div>

    <script>
        async function init() {
            // الحصول على الرابط من s=
            const params = new URLSearchParams(window.location.search);
            const streamUrl = params.get('s');

            if (!streamUrl) {
                console.error("No URL provided in 's' parameter");
                return;
            }

            const video = document.getElementById('video');
            const ui = video['ui'];
            const player = ui.getControls().getPlayer();

            // إعدادات احترافية لضمان تشغيل أغلب الروابط (DASH/HLS)
            player.configure({
                streaming: {
                    lowLatencyMode: true,
                    jumpLargeGaps: true
                }
            });

            try {
                await player.load(decodeURIComponent(streamUrl));
                console.log("Success!");
            } catch (e) {
                console.error("Load Error:", e.code);
            }
        }

        // تشغيل الكود بمجرد تحميل الواجهة
        document.addEventListener('shaka-ui-loaded', init);
    </script>
</body>
</html>
