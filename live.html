<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shaka Player - Custom Settings</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.3.5/shaka-player.compiled.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.3.5/controls.css">
    
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; }
        #video-container { width: 100%; height: 100%; }
        video { width: 100%; height: 100%; }
        
        /* تخصيص الـ UI كما في ملفك */
        .shaka-video-container .shaka-controls-container .shaka-bottom-controls { display: flex; }
        .shaka-range-element { color: #ff0000; } /* مثال لتغيير اللون */
    </style>
</head>
<body>

    <div data-shaka-player-container id="video-container">
        <video data-shaka-player id="video" autoplay muted playsinline></video>
    </div>

    <script>
        async function initApp() {
            // 1. تفعيل الـ Polyfills
            shaka.polyfill.installAll();
            
            const video = document.getElementById('video');
            const ui = video['ui'];
            const controls = ui.getControls();
            const player = controls.getPlayer();

            // --- إعداداتك المأخوذة من shakasettings.js ---
            const config = {
                'controlPanelElements': [
                    'play_pause', 'time_and_duration', 'spacer', 
                    'mute', 'volume', 'quality', 'fullscreen', 'overflow_menu'
                ],
                'addCustomButtons': true,
                'overflowMenuButtons': ['language', 'playback_rate', 'cast', 'statistics'],
                'contextMenuElements': ['statistics', 'copy_debug_info']
            };
            ui.configure(config);

            player.configure({
                streaming: {
                    bufferingGoal: 30,
                    rebufferingGoal: 15,
                    jumpLargeGaps: true,
                    lowLatencyMode: true
                },
                manifest: {
                    retryParameters: { maxAttempts: 5 }
                }
            });

            // --- جلب الرابط من المتغير s ---
            const urlParams = new URLSearchParams(window.location.search);
            const streamUrl = urlParams.get('s');

            if (streamUrl) {
                try {
                    // فك تشفير الرابط والتحميل
                    await player.load(decodeURIComponent(streamUrl));
                    console.log("Stream Loaded successfully using custom settings");
                } catch (error) {
                    console.error("Error Code:", error.code, "Check console for details.");
                }
            } else {
                console.warn("No 's' parameter found in URL.");
            }
        }

        // تشغيل عند جاهزية المكتبة
        document.addEventListener('shaka-ui-loaded', initApp);
    </script>
</body>
</html>
