<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shaka Player - Dynamic Link</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.3.5/shaka-player.compiled.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.3.5/controls.css">
    
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        /* جعل المشغل يأخذ مساحة الشاشة بالكامل */
        .video-container {
            width: 100%;
            height: 100%;
        }
        video {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>

    <div data-shaka-player-container class="video-container">
        <video data-shaka-player id="video" autoplay></video>
    </div>

    <script>
        async function initPlayer() {
            // 1. تعريف العناصر
            const video = document.getElementById('video');
            const ui = video['ui'];
            const controls = ui.getControls();
            const player = controls.getPlayer();

            // 2. الحصول على الرابط من المتغير s في الـ URL
            const urlParams = new URLSearchParams(window.location.search);
            const streamUrl = urlParams.get('s'); 

            // 3. التحقق والتشغيل
            if (streamUrl) {
                try {
                    // فك تشفير الرابط في حال كان يحتوي على رموز خاصة
                    const cleanUrl = decodeURIComponent(streamUrl);
                    
                    // إعدادات اختيارية لتحسين التشغيل
                    player.configure({
                        streaming: {
                            bufferingGoal: 30,
                            rebufferingGoal: 15
                        }
                    });

                    await player.load(cleanUrl);
                    console.log('تم تحميل القناة بنجاح:', cleanUrl);
                } catch (error) {
                    console.error('خطأ في تحميل الفيديو:', error);
                    alert('عذراً، تعذر تشغيل هذا الرابط. تأكد من صحته أو من إعدادات CORS.');
                }
            } else {
                console.warn('لم يتم العثور على رابط! يرجى إضافة ?s= متبوعاً برابط الفيديو.');
            }
        }

        // انتظر حتى يتم تحميل واجهة Shaka بالكامل
        document.addEventListener('shaka-ui-loaded', initPlayer);
        
        // التعامل مع أخطاء التحميل العامة
        document.addEventListener('shaka-player-error', (event) => {
            console.error('Shaka Player Error:', event.detail);
        });
    </script>
</body>
</html>
